 if(rows.length&&th&&tab=='herd'&&sub.herd=='sheep')th.insertAdjacentHTML('afterbegin','<label class="selc"><input type="checkbox" class="sel" id="selall"'+(rows.every(r=>SEL.has(rid(r)))?' checked':'')+'></label>');
 updBar()}
document.addEventListener('change',e=>{const t=e.target;if(!t.classList||!t.classList.contains('sel'))return;
 const one=c=>{const tr=c.closest('tr');if(!tr)return;c.checked?SEL.add(rid(tr)):SEL.delete(rid(tr));tr.classList.toggle('selrow',c.checked)};
 if(t.id=='selall')document.querySelectorAll('#app tr[data-edit^="sheep:"] .sel').forEach(c=>{c.checked=t.checked;one(c)});
 else{one(t);const a=$q('#selall');if(a)a.checked=[...document.querySelectorAll('#app tr[data-edit^="sheep:"] .sel')].every(c=>c.checked)}
 updBar()});
function undoBulk(old){const d=document.createElement('div');d.style.cssText='position:fixed;left:16px;right:16px;bottom:100px;max-width:420px;margin:auto;background:#2a2f1c;color:#fff;border-radius:16px;padding:12px 16px;z-index:60;display:flex;justify-content:space-between;align-items:center';d.innerHTML='<span>اتحذف '+old.length+' خروف</span><button class="chip on" type="button">↩️ تراجع</button>';d.querySelector('button').onclick=()=>{chunk(old,(b,x)=>b.set(db.collection('sheep').doc(x.id),x.r));d.remove()};document.body.append(d);setTimeout(()=>d.remove(),10000)}
function bulk(v){if(v=='clear'){SEL.clear();return render()}
 const L=[...SEL].map(id=>S.sheep.find(x=>x.id==id)).filter(Boolean);if(!L.length||!db)return;
 const n=L.length,nums=L.slice(0,8).map(s=>s.num).join('، ')+(n>8?'…':''),strip=s=>{const{id,...r}=s;return r},set=fn=>chunk(L,(b,s)=>b.set(db.collection('sheep').doc(s.id),fn(strip(s))));
 if(v=='sold'||v=='dead'){const st=v=='sold'?'مباع':'نافق';if(!confirm(n+' خروف ('+nums+') هيتسجلوا '+st+'؟'))return;set(r=>({...r,status:st}));SEL.clear();toast('اتسجل '+n+' '+st+' ✅');render()}
 else if(v=='block'||v=='unblock'){set(r=>({...r,nosale:v=='block'}));SEL.clear();toast(v=='block'?'اتحظر بيع '+n+' خروف 🚫':'اتفك الحظر عن '+n+' خروف ✅');render()}
 else if(v=='move')ask('انقل '+n+' خروف لعنبر رقم',b=>{if(!b)return;set(r=>({...r,barn:b}));SEL.clear();toast('اتنقلوا لعنبر '+b+' ✅');render()});
 else if(v=='del'){if(!confirm('هتحذف '+n+' خروف ('+nums+') نهائياً (رقم غلط)؟\nهيظهرلك زرار تراجع بعدها.'))return;const old=L.map(s=>({id:s.id,r:strip(s)}));chunk(L,(b,s)=>b.delete(db.collection('sheep').doc(s.id)));SEL.clear();render();undoBulk(old)}}
// ---- wrap views
const oH=home,oHe=herd,oM=mom,oR=render;
home=()=>ins(oH(),'<h2>حاسبة البيع</h2>',alertsCard()+tools()+predCard());
herd=()=>{let h=oHe();if(sub.herd=='sheep')h=ins(h,'<div class="g2">',tools());if(sub.herd=='batch')h+=batchCard();return h};
mom=()=>{const h=oM();return sub.mom=='ewe'||sub.mom=='birth'?ins(h,'<div class="g2">',alertsCard()+wCard()):h};
render=()=>{if(worker()){if(tab=='home'||tab=='tx')tab='herd';if(sub.herd=='batch')sub.herd='sheep';if(sub.mom=='mtx')sub.mom='ewe'}oR();
 if(worker())document.querySelectorAll('[data-t="home"],[data-t="tx"],[data-s="herd:batch"],[data-s="mom:mtx"]').forEach(x=>x.remove());
 decorate();
 const a=document.activeElement;if($q('#sd')&&!(a&&a.closest('#sd')&&/INPUT|SELECT/.test(a.tagName)))openSheep(sdId)};
// ---- offline chip + local notifications
const off=()=>{let e=$q('#off');if(!navigator.onLine){if(!e){e=document.createElement('div');e.id='off';e.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#d97706;color:#fff;padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;z-index:50;white-space:nowrap';e.textContent='📴 أوفلاين – التسجيل شغال وهيترفع لما النت يرجع';document.body.append(e)}}else if(e)e.remove()};
addEventListener('online',off);addEventListener('offline',off);off();
const chk=()=>{try{if(DEMO||!db||!('Notification' in window)||Notification.permission!='granted'||!loaded.vet||!loaded.mom||localStorage.ntf==today())return;const o=alerts();if(!o.length)return;localStorage.ntf=today();new Notification('🐑 خرفاني',{body:o.slice(0,5).map(x=>x.n+' – '+x.a).join('\n')})}catch(_){}};
setInterval(chk,60000);setTimeout(chk,6000);
render();
})();
</script>
